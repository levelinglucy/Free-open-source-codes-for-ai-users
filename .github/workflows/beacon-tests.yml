name: Beacon safety tests

on:
  push:
    branches:
      - main
      - "noe/portfolio-*"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile public beacon without running it
        run: python -m py_compile Noe_Buddy_Beacon.py
      - name: Run synthetic offline checks
        run: python -m unittest discover -s tests -v
